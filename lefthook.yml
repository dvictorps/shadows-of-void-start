pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx}"
      run: pnpm exec oxlint --fix --disable-nested-config {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc,css,md,yml,yaml,toml}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: pnpm lint:errors
    typecheck:
      run: pnpm exec tsc --noEmit
